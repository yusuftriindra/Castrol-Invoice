```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>PT Sukses Adi Surya</title>

  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #666;
      font-size: 14px;
      z-index: 1;
    }

    .loader.hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="iframe-container">

    <div class="loader" id="loader">
      Loading...
    </div>

    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwB1crbgChpNwA86Njp7n-u13fin9OuPKUV9odnnZzRPmXkcQUNnWJXmfYJUH95QL7T/exec"
      title="PT Sukses Adi Surya"

      <!--
        Izinkan aplikasi di dalam iframe menggunakan:
        - Geolocation
        - Fullscreen
        - Popup
      -->
      allow="geolocation; fullscreen; camera; microphone; payment"

      allowfullscreen>

    </iframe>

  </div>

  <script>
    const iframe = document.getElementById("appFrame");
    const loader = document.getElementById("loader");

    /*
     * Sembunyikan loader setelah iframe selesai dimuat.
     */
    iframe.addEventListener("load", function () {
      loader.classList.add("hidden");
    });
  </script>

</body>
</html>
